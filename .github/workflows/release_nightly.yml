name: Brother IDE AI - Nightly

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # 📥 Clone repo
      - name: Checkout
        uses: actions/checkout@v4

      # 🦀 Rust
      - name: Install Rust
        uses: rust-lang/rust-toolchain@v1
        with:
          toolchain: stable

      # ⚡ Cache
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # 🐧 Linux deps (Zed important)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libvulkan-dev \
            clang \
            cmake

      # 🍎 macOS deps
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config

      # 🪟 Windows setup
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Windows deps
        if: runner.os == 'Windows'
        run: choco install llvm cmake -y

      # 🔨 Build Zed (IMPORTANT)
      - name: Build
        run: cargo build --release -p zed

      # 📦 Préparer binaire Linux/macOS
      - name: Prepare binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/release/zed dist/brother-ide-ai

      # 📦 Préparer binaire Windows
      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\release\zed.exe dist\brother-ide-ai.exe

      # 🚀 Upload
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brother-ide-ai-${{ runner.os }}
          path: dist/
          retention-days: 7
