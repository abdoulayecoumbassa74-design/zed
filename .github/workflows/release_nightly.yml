name: Brother IDE AI - Nightly

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        # Correction : Utilisation de dtolnay/rust-toolchain qui est l'action standard
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config libssl-dev libgtk-3-dev libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libudev-dev libvulkan-dev clang cmake

      - name: Build
        run: cargo build --release

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist
          # On cherche l'exécutable dans target/release
          find target/release -maxdepth 1 -type f -executable -exec cp {} dist/brother-ide-ai \; 2>/dev/null || cp target/release/*.exe dist/brother-ide-ai.exe 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brother-ide-ai-${{ runner.os }}
          path: dist/
          retention-days: 7
